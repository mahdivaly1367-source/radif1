    <meta charset="UTF-8" />

    <script>
      (function() {
        try {
          var _nativeFetch = window.fetch;
          var _currentFetch = function() {
            return _nativeFetch.apply(window, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Could not define fetch setter:', e);
        }
      })();
    </script>
